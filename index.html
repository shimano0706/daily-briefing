<style>
  :root{
    --paper:#F2F3EF; --card:#FAFAF8; --ink:#1B2430; --ink-2:#3A4048;
    --muted:#71756B; --rule:#DCDDD3; --bar:rgba(242,243,239,.86);
    --accent:#26399B; --accent-soft:rgba(38,57,155,.09);
    --display:"Hiragino Mincho ProN","Yu Mincho",serif;
    --body:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
  }
  body[data-slot="am"] {--accent:#26399B;--accent-soft:rgba(38,57,155,.09);}
  body[data-slot="mid"]{--accent:#8C6110;--accent-soft:rgba(140,97,16,.11);}
  body[data-slot="pm"] {--accent:#AD4E17;--accent-soft:rgba(173,78,23,.10);}

  @media (prefers-color-scheme: dark){
    :root{
      --paper:#14171C; --card:#1B1F26; --ink:#ECEAE3; --ink-2:#C6C8C2;
      --muted:#8B8F87; --rule:#2C313A; --bar:rgba(20,23,28,.86);
    }
    body[data-slot="am"] {--accent:#8CA0F5;--accent-soft:rgba(140,160,245,.13);}
    body[data-slot="mid"]{--accent:#E0AC4C;--accent-soft:rgba(224,172,76,.13);}
    body[data-slot="pm"] {--accent:#EE8B52;--accent-soft:rgba(238,139,82,.13);}
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:var(--body);font-size:17px;line-height:1.7;
    -webkit-font-smoothing:antialiased;
    padding:0 0 calc(96px + var(--safe-b));
    overscroll-behavior-y:contain;
  }
  .pad{padding-left:20px;padding-right:20px;}

  /* ---- sticky header ---- */
  .top{
    position:sticky;top:0;z-index:20;
    padding-top:calc(10px + var(--safe-t));padding-bottom:10px;
    background:var(--bar);
    -webkit-backdrop-filter:saturate(180%) blur(14px);
    backdrop-filter:saturate(180%) blur(14px);
    border-bottom:1px solid var(--rule);
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .stamp{font-family:var(--mono);font-size:13px;letter-spacing:.02em;
         color:var(--muted);font-variant-numeric:tabular-nums;}
  .stamp b{color:var(--ink);font-weight:600;}
  .live{
    display:inline-block;width:6px;height:6px;border-radius:50%;
    background:var(--accent);margin-right:7px;vertical-align:1px;
  }
  .now-btn{
    font:inherit;font-size:13px;background:none;border:none;padding:8px 0 8px 12px;
    color:var(--muted);text-decoration:underline;text-underline-offset:3px;
  }
  .now-btn:disabled{opacity:.35;text-decoration:none;}

  /* ---- day chips ---- */
  .days{display:flex;gap:6px;padding-top:14px;}
  .days button{
    flex:1;min-height:38px;font:inherit;font-size:15px;
    background:transparent;color:var(--muted);
    border:1px solid var(--rule);border-radius:9px;
  }
  .days button[aria-pressed="true"]{
    background:var(--accent);border-color:var(--accent);color:var(--paper);font-weight:700;
  }

  /* ---- week curve ---- */
  .curve{margin-top:16px;}
  .curve svg{display:block;width:100%;height:auto;overflow:visible;}
  .track{fill:none;stroke:var(--rule);stroke-width:1.5;}
  .wave{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;}
  .wave-fill{fill:var(--accent-soft);stroke:none;}
  .now-dot{fill:var(--paper);stroke:var(--accent);stroke-width:5;}
  .cap{font-size:11.5px;color:var(--muted);margin-top:6px;letter-spacing:.02em;}

  /* ---- headline ---- */
  .eyebrow{
    display:flex;align-items:center;gap:9px;margin:26px 0 8px;
    font-size:11px;letter-spacing:.14em;color:var(--accent);font-weight:700;
  }
  .eyebrow::after{content:"";flex:1;height:1px;background:var(--rule);}
  h1{font-family:var(--display);font-size:31px;line-height:1.34;font-weight:600;
     margin:0 0 6px;letter-spacing:.01em;}
  .role{font-size:13.5px;color:var(--muted);margin:0;letter-spacing:.02em;}

  .q{
    margin:22px 0 0;padding:17px 18px;border-radius:12px;
    background:var(--card);border-left:3px solid var(--accent);
  }
  .q span{display:block;font-size:10.5px;letter-spacing:.16em;color:var(--muted);margin-bottom:7px;}
  .q p{margin:0;font-family:var(--display);font-size:19px;line-height:1.62;font-weight:600;}

  h2{font-size:10.5px;letter-spacing:.16em;color:var(--muted);font-weight:700;
     margin:32px 0 2px;}

  ul{list-style:none;margin:0;padding:0;}
  .acts li{
    position:relative;padding:15px 0 15px 26px;border-top:1px solid var(--rule);
    font-size:16px;line-height:1.68;
  }
  .acts li:last-child{border-bottom:1px solid var(--rule);}
  .acts li::before{content:"";position:absolute;left:2px;top:26px;
                   width:10px;height:2px;background:var(--accent);border-radius:1px;}
  .src{display:inline-block;margin-left:6px;font-family:var(--mono);font-size:10.5px;
       color:var(--muted);white-space:nowrap;}

  .pool li{
    position:relative;padding:14px 0 14px 30px;border-top:1px solid var(--rule);
    font-size:15px;line-height:1.66;color:var(--ink-2);
  }
  .pool li:last-child{border-bottom:1px solid var(--rule);}
  .pool .no{position:absolute;left:0;top:15px;font-family:var(--mono);
            font-size:10.5px;color:var(--muted);}
  .redraw{
    display:block;width:100%;min-height:44px;margin-top:14px;
    font:inherit;font-size:14px;color:var(--muted);
    background:transparent;border:1px dashed var(--rule);border-radius:10px;
  }
  .redraw:active{background:var(--accent-soft);color:var(--accent);}

  .closing{margin:26px 0 0;font-family:var(--display);font-size:14.5px;
           color:var(--muted);line-height:1.8;}

  .weekend{
    margin:26px 0 0;padding:18px;border-radius:12px;
    background:var(--card);border:1px solid var(--rule);
    font-size:15px;color:var(--muted);
  }

  .credit{margin:34px 0 0;padding-top:18px;border-top:1px solid var(--rule);
          font-size:11.5px;color:var(--muted);line-height:1.9;}

  /* ---- fixed bottom slot bar ---- */
  .slots{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    display:flex;gap:8px;
    padding:10px 16px calc(10px + var(--safe-b));
    background:var(--bar);
    -webkit-backdrop-filter:saturate(180%) blur(16px);
    backdrop-filter:saturate(180%) blur(16px);
    border-top:1px solid var(--rule);
  }
  .slots button{
    flex:1;min-height:52px;font:inherit;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    background:transparent;color:var(--muted);
    border:1px solid var(--rule);border-radius:12px;
  }
  .slots button .hh{font-family:var(--mono);font-size:15px;font-weight:600;
                    font-variant-numeric:tabular-nums;}
  .slots button .lb{font-size:10.5px;letter-spacing:.06em;}
  .slots button[aria-pressed="true"]{
    background:var(--accent);border-color:var(--accent);color:var(--paper);
  }
  @media (prefers-color-scheme: dark){
    .days button[aria-pressed="true"],.slots button[aria-pressed="true"]{color:#12151A;}
  }

  @media (min-width:520px){
    .pad{max-width:600px;margin:0 auto;}
    .slots{justify-content:center;}
    .slots button{max-width:180px;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important;}}
</style>
</head>
<body data-slot="am">

<div class="top pad">
  <div class="stamp"><span class="live"></span><b id="d-date">—</b> <span id="d-time"></span></div>
  <button class="now-btn" id="reset" disabled>いまに戻す</button>
</div>

<div class="pad">
  <nav class="days" id="days" aria-label="曜日">
    <button data-day="1">月</button><button data-day="2">火</button>
    <button data-day="3">水</button><button data-day="4">木</button>
    <button data-day="5">金</button>
  </nav>

  <div class="curve">
    <svg viewBox="0 0 340 92" role="img" aria-label="1週間の負荷カーブ">
      <line class="track" x1="14" y1="76" x2="326" y2="76"/>
      <path id="wfill" class="wave-fill" d=""/>
      <path id="wline" class="wave" d=""/>
      <circle id="wdot" class="now-dot" r="7" style="display:none"/>
    </svg>
    <div class="cap">月 7割 ／ 火・水 ピーク ／ 木 テーパリング ／ 金 クロージング</div>
  </div>

  <main id="panel">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title"></h1>
    <p class="role" id="role"></p>

    <div class="q"><span>今日の問い</span><p id="question"></p></div>

    <h2>今日の行動</h2>
    <ul class="acts" id="acts"></ul>

    <h2>今日思い出す3つの原則</h2>
    <ul class="pool" id="pool"></ul>
    <button class="redraw" id="redraw">別の3件を引く</button>

    <p class="closing" id="closing"></p>
  </main>

const M=POOL.length;

function pickPrinciples(dt,slot,shift){
  const ymd=dt.getFullYear()*10000+(dt.getMonth()+1)*100+dt.getDate();
  const N=ymd+OFF[slot]+(shift||0)*97;
  const idx=[];
  [0,13,26].forEach(k=>{let i=((N*7+k)%M+M)%M;while(idx.includes(i))i=(i+1)%M;idx.push(i);});
  return idx;
}

/* curve geometry (mobile viewBox 340x92) */
const X0=26,X1=314,Y0=76,AMP=58;
const xOf=d=>X0+(X1-X0)*(d-1)/4, yOf=d=>Y0-AMP*LOAD[d];
function drawCurve(active){
  const pts=[1,2,3,4,5].map(d=>[xOf(d),yOf(d)]);
  let p=`M ${pts[0][0]} ${pts[0][1]}`;
  for(let i=0;i<4;i++){
    const [x1,y1]=pts[i],[x2,y2]=pts[i+1],mx=(x1+x2)/2;
    p+=` C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`;
  }
  document.getElementById('wline').setAttribute('d',p);
  document.getElementById('wfill').setAttribute('d',`${p} L ${X1} ${Y0} L ${X0} ${Y0} Z`);
  const dot=document.getElementById('wdot');
  if(active){dot.style.display='';dot.setAttribute('cx',xOf(active));dot.setAttribute('cy',yOf(active));}
  else dot.style.display='none';
}

let cur={day:1,slot:'am'},shift=0,refDate=new Date(),manual=false;

function renderPool(){
  document.getElementById('pool').innerHTML=
    pickPrinciples(refDate,cur.slot,shift).map(i=>{
      const [t,s]=POOL[i].split('｜');
      return `<li><span class="no">${String(i+1).padStart(2,'0')}</span>${t}<span class="src">${s}</span></li>`;
    }).join('');
}

function render(day,slot){
  cur={day,slot};shift=0;
  document.body.dataset.slot=slot;
  const e=DATA[day+slot];
  document.getElementById('eyebrow').textContent=`${e.e} ・ ${TIME[slot]}`;
  document.getElementById('title').textContent=e.t;
  document.getElementById('role').textContent=e.r;
  document.getElementById('question').textContent="「"+e.q+"」";
  document.getElementById('acts').innerHTML=
    e.a.map(x=>`<li>${x[0]}<span class="src">${x[1]}</span></li>`).join('');
  document.getElementById('closing').textContent=e.c;
  renderPool();drawCurve(day);
  document.querySelectorAll('[data-day]').forEach(b=>
    b.setAttribute('aria-pressed',String(+b.dataset.day===day)));
  document.querySelectorAll('[data-slot]').forEach(b=>
    b.setAttribute('aria-pressed',String(b.dataset.slot===slot)));
  document.getElementById('reset').disabled=!manual;
}

function stamp(){
  const n=new Date(),jp=["日","月","火","水","木","金","土"][n.getDay()];
  document.getElementById('d-date').textContent=`${n.getMonth()+1}/${n.getDate()} (${jp})`;
  document.getElementById('d-time').textContent=
    `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
}

function now(){
  manual=false;refDate=new Date();stamp();
  const wd=refDate.getDay(),we=(wd===0||wd===6);
  document.getElementById('weekend').hidden=!we;
  document.getElementById('panel').hidden=we;
  document.getElementById('reset').disabled=true;
  if(we){drawCurve(0);return;}
  const h=refDate.getHours();
  render(wd,h<12?'am':(h<17?'mid':'pm'));
}

function pick(fn){
  manual=true;
  document.getElementById('weekend').hidden=true;
  document.getElementById('panel').hidden=false;
  fn();
}
document.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',()=>
  pick(()=>render(+b.dataset.day,cur.slot))));
document.querySelectorAll('[data-slot]').forEach(b=>b.addEventListener('click',()=>
  pick(()=>render(cur.day,b.dataset.slot))));
document.getElementById('redraw').addEventListener('click',()=>{shift++;renderPool();});
document.getElementById('reset').addEventListener('click',now);

now();
setInterval(stamp,20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!manual)now();});
